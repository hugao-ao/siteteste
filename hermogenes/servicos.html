<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hermogenes Obras — Serviços</title>
  <script src="hermo-guard.js"></script>
  <link rel="stylesheet" href="hermo-style.css" />
</head>
<body>
  <header class="hermo-topbar">
    <div class="brand">HERMOGENES <span>OBRAS</span> · Serviços</div>
    <div class="actions">
      <a class="hermo-btn ghost" href="index.html">← Voltar</a>
      <button class="hermo-btn danger" id="btn-logout">Sair</button>
    </div>
  </header>

  <main class="hermo-page">
    <section class="hermo-resumo" id="resumo"></section>

    <div class="hermo-page-head">
      <h1>Catálogo de Serviços</h1>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="busca" type="text" placeholder="Buscar por código ou descrição…"
               style="background:var(--hermo-bg);border:1px solid var(--hermo-border);border-radius:8px;color:var(--hermo-text);padding:9px 12px;min-width:240px" />
        <button class="hermo-btn primary" id="btn-novo">+ Novo serviço</button>
      </div>
    </div>

    <div class="hermo-tabela-wrap">
      <table class="hermo-tabela">
        <thead>
          <tr><th style="width:110px">Código</th><th>Descrição</th><th>Detalhe</th><th style="width:90px">Unidade</th><th style="width:130px">Ações</th></tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
    <div id="vazio" class="hermo-vazio" style="display:none;margin-top:16px">
      <div class="big">🛠️</div>Nenhum serviço encontrado.
    </div>
  </main>

  <!-- MODAL DE SERVIÇO -->
  <div class="hermo-modal-overlay" id="msv-overlay">
    <div class="hermo-modal compacto">
      <div class="hermo-modal-head">
        <h2 id="msv-titulo">Novo serviço</h2>
        <button class="fechar" id="msv-fechar" title="Fechar">&times;</button>
      </div>
      <div class="hermo-modal-body">
        <div class="hermo-form-row">
          <div class="hermo-field">
            <label>Código <span class="req">*</span></label>
            <input id="msv-codigo" type="text" placeholder="ex.: 04.01" />
          </div>
          <div class="hermo-field">
            <label>Unidade padrão</label>
            <input id="msv-unidade" type="text" placeholder="ex.: m², un, h" />
          </div>
        </div>
        <div class="hermo-field">
          <label>Descrição <span class="req">*</span></label>
          <input id="msv-descricao" type="text" placeholder="Descrição do serviço" />
        </div>
        <div class="hermo-field">
          <label>Detalhe</label>
          <textarea id="msv-detalhe" placeholder="Detalhamento opcional"></textarea>
        </div>
      </div>
      <div class="hermo-modal-foot">
        <button class="hermo-btn ghost" id="msv-cancelar">Cancelar</button>
        <button class="hermo-btn primary" id="msv-salvar">Salvar serviço</button>
      </div>
    </div>
  </div>

  <script type="module" src="servicos.js"></script>
</body>
</html>
