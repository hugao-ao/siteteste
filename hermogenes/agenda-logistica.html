<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hermogenes Obras — Agenda e Logística</title>
  <script src="hermo-guard.js"></script>
  <link rel="stylesheet" href="hermo-style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* layout específico desta página */
    .al-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 960px) { .al-grid { grid-template-columns: 1fr; } }
    #al-mapa { width: 100%; height: 520px; border-radius: var(--hermo-radius); border: 1px solid var(--hermo-border); isolation: isolate; }
    .al-painel {
        background: var(--hermo-surface);
        border: 1px solid var(--hermo-border);
        border-radius: var(--hermo-radius);
        padding: 16px;
        display: flex; flex-direction: column; gap: 12px;
    }
    .al-painel h2 { font-size: 1rem; }
    .al-dica { font-size: .8rem; color: var(--hermo-text-dim); }
    .al-paradas { display: flex; flex-direction: column; gap: 8px; }
    .al-parada {
        display: flex; align-items: center; gap: 8px;
        background: var(--hermo-surface-2); border: 1px solid var(--hermo-border);
        border-radius: 8px; padding: 8px 10px; font-size: .85rem;
    }
    .al-parada .num {
        min-width: 24px; height: 24px; border-radius: 50%;
        background: var(--hermo-primary); color: #1a1206; font-weight: 700;
        display: flex; align-items: center; justify-content: center; font-size: .8rem;
    }
    .al-parada .txt { flex: 1; }
    .al-parada .txt small { color: var(--hermo-text-dim); display: block; }
    .al-parada input.perm {
        width: 64px; background: var(--hermo-bg); border: 1px solid var(--hermo-border);
        border-radius: 6px; color: var(--hermo-text); padding: 5px 7px; font-size: .85rem; text-align: right;
    }
    .al-timeline {
        background: var(--hermo-bg); border: 1px solid var(--hermo-border);
        border-radius: 8px; padding: 12px; font-size: .84rem;
        display: none; flex-direction: column; gap: 6px;
    }
    .al-timeline.aberta { display: flex; }
    .al-timeline .tl-linha { display: flex; gap: 8px; align-items: baseline; }
    .al-timeline .tl-hora { min-width: 88px; font-weight: 700; color: var(--hermo-primary); }
    .al-timeline .tl-desloc { color: var(--hermo-text-dim); font-size: .78rem; padding-left: 96px; }
    .al-timeline .tl-total { border-top: 1px solid var(--hermo-border); margin-top: 6px; padding-top: 8px; font-weight: 600; }
    .al-rotas-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 8px; }
    .rota-card {
        background: var(--hermo-surface); border: 1px solid var(--hermo-border);
        border-left: 6px solid var(--hermo-primary); border-radius: 10px; padding: 14px;
        display: flex; flex-direction: column; gap: 8px; font-size: .86rem;
    }
    .rota-card .rc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rota-card .rc-nome { font-weight: 700; }
    .rota-card .rc-meta { color: var(--hermo-text-dim); font-size: .8rem; }
    .rota-card .rc-aviso {
        background: rgba(234,179,8,.12); border: 1px solid rgba(234,179,8,.4);
        color: var(--hermo-warn); border-radius: 8px; padding: 6px 10px; font-size: .78rem;
    }
    .rota-card .rc-chain {
        background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.4);
        color: var(--hermo-info); border-radius: 8px; padding: 6px 10px; font-size: .78rem;
    }
    .rota-card .acoes { display: flex; gap: 8px; justify-content: flex-end; }
    .al-marker-num {
        background: var(--hermo-primary); color: #1a1206; font-weight: 700;
        border: 2px solid #0f172a; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        width: 26px !important; height: 26px !important; font-size: .8rem;
    }
  </style>
</head>
<body>
  <header class="hermo-topbar">
    <div class="brand">HERMOGENES <span>OBRAS</span> · Agenda e Logística</div>
    <div class="actions">
      <a class="hermo-btn ghost" href="index.html">← Voltar</a>
      <button class="hermo-btn danger" id="btn-logout">Sair</button>
    </div>
  </header>

  <main class="hermo-page">
    <section class="hermo-resumo" id="resumo"></section>

    <div class="hermo-page-head">
      <h1>Montagem de Rotas</h1>
      <span class="al-dica">Clique nos marcadores de visitas <b>marcadas</b> no mapa para montar a rota, na ordem desejada.</span>
    </div>

    <div class="al-grid">
      <div>
        <div id="al-mapa"></div>
        <div class="hermo-mapa-legenda" id="mapa-legenda"></div>
      </div>

      <!-- PAINEL DA ROTA EM MONTAGEM -->
      <div class="al-painel">
        <h2 id="al-titulo">Nova rota</h2>

        <div class="hermo-field">
          <label>Nome da rota <span class="req">*</span></label>
          <input id="al-nome" type="text" placeholder="ex.: Rota manhã — Zona Sul" />
        </div>

        <div class="hermo-field">
          <label>Encadeamento</label>
          <select id="al-encadear">
            <option value="">— rota independente —</option>
          </select>
        </div>

        <div class="hermo-form-row">
          <div class="hermo-field">
            <label>Partida (data e hora) <span class="req">*</span></label>
            <input id="al-inicio" type="datetime-local" />
          </div>
          <div class="hermo-field">
            <label>Ponto de partida (endereço)</label>
            <input id="al-partida-end" type="text" placeholder="opcional — ex.: escritório" />
          </div>
        </div>
        <div class="al-dica" id="al-encadear-dica" style="display:none"></div>

        <div class="hermo-field">
          <label>Paradas da rota (<span id="al-num-paradas">0</span>)</label>
          <div class="al-paradas" id="al-paradas">
            <div class="al-dica">Nenhuma visita selecionada — clique nos marcadores azuis do mapa.</div>
          </div>
          <div class="al-dica" id="al-esboco-info" style="display:none;margin-top:6px"></div>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="hermo-btn primary" id="al-calcular">🧭 Calcular rota</button>
          <button class="hermo-btn" id="al-salvar" disabled>💾 Salvar rota</button>
          <button class="hermo-btn ghost" id="al-limpar">Limpar</button>
        </div>

        <div class="al-timeline" id="al-timeline"></div>
      </div>
    </div>

    <div class="hermo-page-head" style="margin-top:30px">
      <h1>Rotas salvas</h1>
    </div>
    <div class="al-rotas-lista" id="al-rotas"></div>
    <div id="al-rotas-vazio" class="hermo-vazio" style="display:none">
      <div class="big">🗺️</div>Nenhuma rota criada ainda.
    </div>
  </main>

  <script type="module" src="agenda-logistica.js"></script>
</body>
</html>
