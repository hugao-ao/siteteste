<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>Argos Gestão — Início</title>
  <script src="argos-guard.js"></script>
  <link rel="stylesheet" href="argos-style.css" />
</head>
<body>
  <header class="argos-topbar">
    <div class="brand">ARGOS <span>GESTÃO</span></div>
    <div class="actions">
      <button class="argos-btn danger" id="btn-logout">Sair</button>
    </div>
  </header>

  <main class="argos-home">
    <h1>Painel de Gestão</h1>
    <p class="sub">Selecione um módulo para começar.</p>

    <div class="argos-cards-grid" id="cards-grid">
      <!-- Os módulos da área Argos serão adicionados aqui como cards. -->
    </div>

    <div class="argos-vazio" id="home-vazio">
      <div class="icon">🏗️</div>
      <strong>Área Argos criada</strong>
      Os módulos desta área serão adicionados aqui em breve.
    </div>
  </main>

  <!-- logout é ligado pelo argos-guard.js (sem dependência de CDN) -->
  <script>
  // Esconde o aviso de "área vazia" assim que existirem cards de módulos.
  (function () {
      'use strict';
      var grid = document.getElementById('cards-grid');
      var vazio = document.getElementById('home-vazio');
      if (grid && vazio && grid.querySelector('.argos-card-nav')) {
          vazio.style.display = 'none';
      }
  })();
  </script>
</body>
</html>
