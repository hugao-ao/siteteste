<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.1, maximum-scale=10, user-scalable=yes" />
  <title>Argos Gestão</title>
  <script src="argos-guard.js"></script>
  <link rel="stylesheet" href="argos-style.css?v=4" />
</head>
<body>
  <header class="argos-topbar">
    <div class="brand">ARGOS <span>GESTÃO</span></div>
    <div class="actions">
      <button class="argos-btn danger" id="btn-logout">Sair</button>
    </div>
  </header>

  <main class="argos-home">
    <h1>Painel de Gestão</h1>
    <p class="sub">Selecione um módulo para começar.</p>

    <div class="argos-cards-grid" id="cards-grid">
      <a class="argos-card-nav" data-key="usuarios" data-argos-recurso="card_home_usuarios" href="usuarios.html">
        <div class="icon">👥</div>
        <div class="titulo">Usuários e Permissões</div>
        <div class="desc">Crie usuários e tipos de usuário e controle o que cada um pode fazer e ver na área Argos.</div>
      </a>
    </div>

    <div class="argos-vazio" id="home-vazio" style="display:none">
      <div class="icon">🚧</div>
      <strong>Área em desenvolvimento</strong>
      Novos módulos serão adicionados aqui em breve.
    </div>
  </main>

  <!-- logout é ligado pelo argos-guard.js (sem dependência de CDN) -->
  <script type="module">
  // Esconde os cards que o usuário logado não tem permissão de ver.
  // Se nenhum card ficar visível, mostra o aviso de área em desenvolvimento.
  import { carregarPermissoes } from './argos-permissoes.js';
  const perm = await carregarPermissoes();
  perm.aplicarVisibilidade();
  const visiveis = Array.from(document.querySelectorAll('.argos-card-nav'))
      .filter(c => c.style.display !== 'none');
  if (!visiveis.length) document.getElementById('home-vazio').style.display = '';
  </script>
  <script type="module" src="argos-zoom.js?v=4"></script>
</body>
</html>
